version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2
      nodejs: 18.x
    commands:
      - php -r "copy('https://getcomposer.org/installer', 'composer-setup.php');"
      - php -r "if (hash_file('sha384', 'composer-setup.php') !== file_get_contents('https://composer.github.io/installer.sig')) { unlink('composer-setup.php'); exit(1); }"
      - php composer-setup.php --install-dir=/usr/local/bin --filename=composer
      - rm composer-setup.php
  pre_build:
    commands:
      - composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
      - npm ci
  build:
    commands:
      - npm run build

# Runtime secrets and cached configuration must stay out of the artifact.
artifacts:
  files:
    - appspec.yml
    - artisan
    - composer.json
    - composer.lock
    - 'app/**/*'
    - 'bootstrap/**/*'
    - 'config/**/*'
    - 'database/**/*'
    - 'public/**/*'
    - 'resources/**/*'
    - 'routes/**/*'
    - 'scripts/**/*'
    - 'vendor/**/*'
  exclude-paths:
    - 'bootstrap/cache/config.php'
    - 'public/hot'
